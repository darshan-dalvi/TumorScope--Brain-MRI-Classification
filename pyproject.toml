[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-tumor-detection"
version = "0.1.0"
description = "Brain Tumor Detection using Deep Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.95.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.14.0",
    "pillow>=9.5.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.21.0",
]

[tool.hatch.build]
packages = ["src/brain_tumor_detection"]
